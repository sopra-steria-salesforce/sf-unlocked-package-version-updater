name: Continuous Integration
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Dependencies
        id: npm-ci
        run: npm ci
      - name: Check Format
        id: npm-format-check
        run: npm run format:check
      - name: Lint
        id: npm-lint
        run: npm run lint
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Print Output (Before)
        run: |
          for dir in $(jq -r '.packageDirectories[].path' sfdx-project.json); do
            version=$(jq -r --arg dir "$dir" '.packageDirectories[] | select(.path == $dir) | .versionNumber' sfdx-project.json)
            echo "Package directory: $dir, Version number: $version"
          done
      - name: Test Local Action
        id: test-action
        uses: ./
      - name: Print Output (After)
        run: |
          for dir in $(jq -r '.packageDirectories[].path' sfdx-project.json); do
            version=$(jq -r --arg dir "$dir" '.packageDirectories[] | select(.path == $dir) | .versionNumber' sfdx-project.json)
            echo "Package directory: $dir, Version number: $version"
          done
      - run: |
          echo "version=$(jq -r '.packageDirectories[1].versionNumber' sfdx-project.json)" >> $GITHUB_OUTPUT
        id: check

      - name: Verify Version Number
        if: steps.check.outputs.version != '0.2.0.NEXT'
        run: exit 1
